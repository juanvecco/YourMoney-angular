<div class="ym-month-picker" role="group" aria-label="Período financeiro">
  <button type="button" class="ym-month-picker__button" aria-label="Mês anterior" (click)="shift(-1)">
    <i class="bi bi-chevron-left" aria-hidden="true"></i>
  </button>
  <label class="ym-month-picker__current">
    <span aria-live="polite">{{ label }}</span>
    <span class="visually-hidden">Selecionar mês</span>
    <input type="month" [value]="inputValue" aria-label="Selecionar mês financeiro" (change)="select($any($event.target).value)">
  </label>
  <button type="button" class="ym-month-picker__button" aria-label="Próximo mês" (click)="shift(1)">
    <i class="bi bi-chevron-right" aria-hidden="true"></i>
  </button>
</div>
