<header class="ym-topbar">
    <nav class="ym-nav">
        <a class="ym-brand" href="/dashboard">
            <img src="assets/logo.png" alt="Your Money" class="ym-logo" />
        </a>
        <ul class="ym-menu">
            <li><a href="/dashboard"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
            <li><a href="/receitas"><i class="bi bi-arrow-up-circle"></i>Receitas</a></li>
            <li><a href="/despesas"><i class="bi bi-arrow-down-circle"></i>Despesas</a></li>
            <li><a href="/investimento"><i class="bi bi-graph-up-arrow"></i>Investimentos</a></li>
            <li><a class="active" href="/configuracao"><i class="bi bi-gear"></i>Configurações</a></li>
        </ul>
    </nav>
</header>

<main class="ym-shell">
    <div class="ym-container">
        <div class="ym-page-header">
            <div class="ym-title-group">
                <p class="ym-eyebrow">Administração</p>
                <h1 class="ym-title">Configurações</h1>
                <p class="ym-subtitle">Gerencie dados de apoio usados nas telas financeiras.</p>
            </div>
        </div>

        <section class="ym-kpi-grid three">
            <article class="ym-card ym-kpi accent-primary" role="button" tabindex="0" (click)="abrirModalCategoria()">
                <i class="ym-kpi-icon bi bi-tags"></i>
                <h2 class="ym-kpi-label">Categorias</h2>
                <p class="ym-kpi-value">Organização</p>
                <p class="ym-kpi-meta">Gerencie tipos, naturezas e categorias específicas.</p>
            </article>
        </section>

        <app-criar-categoria *ngIf="mostrarModalCategoria" [editando]="false" (salvar)="salvarCategoria($event)"
            (fechar)="fecharModalCategoria()">
        </app-criar-categoria>
    </div>
</main>
