<div class="ym-shell">
    <div class="ym-container">
        <app-page-header eyebrow="Saldo operacional" heading="Disponível"
            description="Veja quanto restou depois das receitas e despesas do mês.">
            <app-month-picker pageHeaderActions [period]="mesAtual" (periodChange)="selecionarMes($event)"></app-month-picker>
        </app-page-header>

        <section class="ym-card ym-card-pad">
            <app-view-state [state]="estadoDaPagina" [message]="mensagemCarregamento"
                [retryAvailable]="estadoDaPagina === 'loadError'" (retry)="carregarDados()"></app-view-state>
            <article class="ym-kpi" [class.accent-success]="calcularDisponivel() >= 0"
                [class.accent-danger]="calcularDisponivel() < 0">
                <i class="ym-kpi-icon" [class]="obterIconeDisponivel()"></i>
                <h2 class="ym-kpi-label">{{ obterTextoDisponivel() }}</h2>
                <p class="ym-kpi-value">{{ formatarValor(calcularDisponivel()) }}</p>
                <p class="ym-kpi-meta">Baseado no mês selecionado</p>
                <button class="ym-button primary mt-3" type="button" (click)="abrirModalInvestimento()"
                    [disabled]="calcularDisponivel() <= 0">
                    <i class="bi bi-graph-up-arrow"></i>Investir agora
                </button>
            </article>
        </section>
    </div>
</div>
