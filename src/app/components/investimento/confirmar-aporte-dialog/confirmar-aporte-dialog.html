<dialog #dialog class="aporte-dialog" aria-labelledby="tituloAporte" (cancel)="fechar()">
  <form (ngSubmit)="salvar()">
    <p class="ym-form-hint">Campos com * são obrigatórios.</p>
    <h2 id="tituloAporte">Confirmar valor guardado</h2>
    <p *ngIf="meta"><strong>{{ meta.nome }}</strong> · planejado {{ meta.valorCalculado | financialValue }}</p>
    <label><span>Valor confirmado <span class="ym-required" aria-hidden="true">*</span></span>
      <input name="valorAporte" type="number" financialValueInput min="0.01" step="0.01" [(ngModel)]="valor" required /></label>
    <label><span>Data <span class="ym-required" aria-hidden="true">*</span></span>
      <input name="dataAporte" type="date" [(ngModel)]="dataConfirmacao" required /></label>
    <label>Onde o dinheiro ficou alocado (opcional)
      <select name="investimentoAporte" [(ngModel)]="investimentoId"><option value="">Informar depois</option><option *ngFor="let item of destinos" [value]="item.id">{{ item.nome }}</option></select>
    </label>
    <small>A confirmação acompanha o plano, mas não altera o saldo do investimento.</small>
    <p class="erro" role="alert" *ngIf="erro">{{ erro }}</p>
    <div><button type="button" (click)="fechar()">Cancelar</button><button type="submit" [disabled]="salvando || valor <= 0">{{ salvando ? 'Confirmando...' : 'Confirmar' }}</button></div>
  </form>
</dialog>
