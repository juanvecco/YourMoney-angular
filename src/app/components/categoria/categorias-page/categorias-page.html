<header class="ym-topbar">
    <nav class="ym-nav">
        <a class="ym-brand" href="/dashboard">
            <img src="assets/logo.png" alt="Your Money" class="ym-logo" />
        </a>
        <ul class="ym-menu">
            <li><a href="/dashboard"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
            <li><a href="/receitas"><i class="bi bi-arrow-up-circle"></i>Receitas</a></li>
            <li><a href="/despesas"><i class="bi bi-arrow-down-circle"></i>Despesas</a></li>
            <li><a href="/investimento"><i class="bi bi-graph-up-arrow"></i>Investimentos</a></li>
            <li><a href="/configuracao"><i class="bi bi-gear"></i>Configurações</a></li>
        </ul>
    </nav>
</header>

<main class="ym-shell">
    <div class="ym-container">
        <div class="ym-page-header">
            <div class="ym-title-group">
                <p class="ym-eyebrow">Cadastro</p>
                <h1 class="ym-title">Categorias</h1>
                <p class="ym-subtitle">Mantenha a classificação das despesas consistente.</p>
            </div>
            <button class="ym-button primary accent-primary" type="button" (click)="abrirModalCategoria()">
                <i class="bi bi-plus-lg"></i>Nova categoria
            </button>
        </div>

        <section class="ym-card ym-card-pad">
            <div class="ym-list">
                <article *ngFor="let c of categorias" class="ym-list-item">
                    <div class="ym-list-main">
                        <h2 class="ym-list-title">{{ c.nome }}</h2>
                    </div>
                    <button class="ym-button" type="button" (click)="abrirModalCategoria(c)">
                        <i class="bi bi-pencil"></i>Editar
                    </button>
                </article>
            </div>
        </section>
    </div>
</main>

<app-criar-categoria *ngIf="mostrarModalCategoria" [categoria]="categoriaSelecionada" [categorias]="categorias"
    [editando]="editando" (salvar)="salvarCategoria($event)" (fechar)="fecharModal()">
</app-criar-categoria>
