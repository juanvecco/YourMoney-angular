<header class="header">
    <div class="nav-inner">
        <img src="assets/logo.png" alt="Your Money" class="logo" />

        <ul class="menu">
            <li><a routerLink="/receitas">Receita</a></li>
            <li><a routerLink="/despesas">Despesas</a></li>
            <li><a routerLink="/investimento">Investimento</a></li>
            <li><a routerLink="/login">Login</a></li>
        </ul>
    </div>
</header>

<section class="hero">
    <!-- Imagem de fundo -->
</section>

<main class="dashboard-content">
    <div class="container">

        <!-- Card de Receitas -->
        <div class="card-global">
            <div class="card-header">
                <h3>Receitas</h3>
            </div>
            <div class="card-body">
                <div class="valor-principal">
                    R$ {{ resumo.receitas | number:'1.2-2' }}
                </div>

                <!-- Botão para adicionar nova receita -->
                <button class="btn-adicionar" (click)="adicionarReceita()">
                    + Adicionar
                </button>
            </div>
        </div>

        <!-- Card de Despesas -->
        <div class="card-global">
            <div class="card-header">
                <h3>Despesas</h3>
            </div>
            <div class="card-body">
                <div class="valor-principal">
                    R$ {{ resumo.despesas | number:'1.2-2' }}
                </div>

                <!-- Botão para adicionar nova despesa -->
                <button class="btn-adicionar" (click)="adicionarDespesa()">
                    + Adicionar
                </button>
            </div>
        </div>

        <!-- Card de Sobrou -->
        <div class="card-global">
            <div class="card-header">
                <h3>Sobrou</h3>
            </div>
            <div class="card-body">
                <div class="valor-principal">
                    R$ {{ resumo.sobrou | number:'1.2-2' }}
                </div>
            </div>
        </div>

    </div>
    <div class="filtro-mes">
        <button (click)="mesAnterior()">‹</button>
        <span>{{ mesAtual | date:'MMMM yyyy':'pt-BR' }}</span>
        <button (click)="proximoMes()">›</button>
    </div>
</main>
