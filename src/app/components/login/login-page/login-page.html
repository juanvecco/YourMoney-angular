<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Money - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --executive-dark: #0a0e27;
            --executive-blue: #1a237e;
            --executive-accent: #304ffe;
            --executive-success: #00c853;
            --executive-danger: #d32f2f;
            --executive-gold: #d4af37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a237e 100%);
            color: #fff;
        }

        .login-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            width: 100%;
        }

        /* Left Side - Branding */
        .branding-section {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.95) 0%, rgba(26, 35, 126, 0.95) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem;
            position: relative;
            overflow: hidden;
        }

        .branding-section::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(48, 79, 254, 0.15) 0%, transparent 70%);
            top: -250px;
            right: -250px;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.5;
            }
        }

        .logo-container {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--executive-accent) 0%, #536dfe 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            margin: 0 auto 2rem;
            box-shadow: 0 10px 40px rgba(48, 79, 254, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .brand-name {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-tagline {
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .feature-list {
            list-style: none;
            text-align: left;
            max-width: 400px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            background: rgba(48, 79, 254, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--executive-accent);
            font-size: 1.2rem;
        }

        .feature-text {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Right Side - Form */
        .form-section {
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem;
        }

        .form-container {
            width: 100%;
            max-width: 440px;
        }

        .form-header {
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .form-title {
            font-size: 2rem;
            font-weight: 700;
            color: #0a0e27;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .form-subtitle {
            font-size: 1rem;
            color: #6c757d;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            color: #2c2c2c;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.875rem 1rem;
            font-size: 1rem;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            background: #f8f9fa;
            transition: all 0.2s ease;
            color: #2c2c2c;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--executive-accent);
            background: white;
            box-shadow: 0 0 0 3px rgba(48, 79, 254, 0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
            padding: 0.5rem;
            font-size: 1.1rem;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--executive-accent);
        }

        .form-hint {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 0.25rem;
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--executive-accent) 0%, #536dfe 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(48, 79, 254, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-links {
            text-align: center;
            margin: 1.5rem 0;
        }

        .form-link {
            color: var(--executive-accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .form-link:hover {
            color: #1a237e;
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: #6c757d;
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e9ecef;
        }

        .divider span {
            padding: 0 1rem;
        }

        .btn-register {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: var(--executive-accent);
            background: transparent;
            border: 2px solid var(--executive-accent);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-register:hover {
            background: var(--executive-accent);
            color: white;
            transform: translateY(-1px);
        }

        .alert-error {
            background: rgba(211, 47, 47, 0.1);
            border: 1px solid rgba(211, 47, 47, 0.3);
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1rem;
            color: var(--executive-danger);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .login-container {
                grid-template-columns: 1fr;
            }

            .branding-section {
                display: none;
            }

            .form-section {
                padding: 2rem 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .form-title {
                font-size: 1.5rem;
            }

            .form-container {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <!-- Left Side - Branding -->
        <div class="branding-section">
            <div class="logo-container">
                <div class="logo-icon">
                    <i class="bi bi-graph-up-arrow"></i>
                </div>
                <div class="brand-name">Your Money</div>
                <div class="brand-tagline">Controle executivo do seu futuro financeiro</div>
            </div>

            <ul class="feature-list">
                <li class="feature-item">
                    <div class="feature-icon">
                        <i class="bi bi-speedometer2"></i>
                    </div>
                    <div class="feature-text">Dashboard em tempo real com métricas estratégicas</div>
                </li>
                <li class="feature-item">
                    <div class="feature-icon">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <div class="feature-text">Segurança de nível bancário para seus dados</div>
                </li>
                <li class="feature-item">
                    <div class="feature-icon">
                        <i class="bi bi-lightning-charge"></i>
                    </div>
                    <div class="feature-text">Insights inteligentes para decisões financeiras</div>
                </li>
            </ul>
        </div>

        <!-- Right Side - Form -->
        <div class="form-section">
            <div class="form-container">
                <div class="form-header">
                    <h2 class="form-title">Bem-vindo de volta</h2>
                    <p class="form-subtitle">Acesse sua conta para continuar</p>
                </div>

                <form [formGroup]="form" (ngSubmit)="onSubmit()">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-envelope"></i>
                            E-mail
                        </label>
                        <input type="email" class="form-control" formControlName="email" placeholder="seu@email.com"
                            required />
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-lock"></i>
                            Senha
                        </label>
                        <div class="password-wrapper">
                            <input [type]="showPassword ? 'text' : 'password'" class="form-control"
                                formControlName="senha" placeholder="Sua senha" required />
                            <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
                                <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login" [disabled]="loading">
                        <span *ngIf="!loading">
                            <i class="bi bi-arrow-right-circle"></i>
                            Entrar
                        </span>
                        <span *ngIf="loading">
                            <i class="bi bi-hourglass-split"></i>
                            Autenticando...
                        </span>
                    </button>

                    <div *ngIf="error" class="alert-error">
                        <i class="bi bi-exclamation-circle"></i>
                        {{ error }}
                    </div>
                </form>

                <div class="form-links">
                    <a href="#" class="form-link">
                        <i class="bi bi-question-circle"></i>
                        Esqueceu sua senha?
                    </a>
                </div>

                <div class="divider">
                    <span>ou</span>
                </div>

                <button type="button" class="btn-register">
                    <i class="bi bi-person-plus"></i>
                    Criar uma Nova Conta
                </button>
            </div>
        </div>
    </div>
</body>

</html>
