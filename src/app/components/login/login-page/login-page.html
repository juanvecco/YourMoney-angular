<main class="login-container">
    <section class="branding-section">
        <div class="logo-container">
            <div class="logo-icon">
                <i class="bi bi-graph-up-arrow"></i>
            </div>
            <h1 class="brand-name">Your Money</h1>
        </div>

        <ul class="feature-list">
            <li class="feature-item">
                <div class="feature-icon"><i class="bi bi-speedometer2"></i></div>
                <div class="feature-text">Dashboard em tempo real com métricas estratégicas</div>
            </li>
            <li class="feature-item">
                <div class="feature-icon"><i class="bi bi-shield-check"></i></div>
                <div class="feature-text">Segurança para seus dados</div>
            </li>
            <li class="feature-item">
                <div class="feature-icon"><i class="bi bi-lightning-charge"></i></div>
                <div class="feature-text">Insights inteligentes para decisões financeiras</div>
            </li>
        </ul>
    </section>

    <section class="form-section">
        <div class="form-container">
            <div class="form-header">
                <h2 class="form-title">Seja bem-vindo(a)</h2>
                <p class="form-subtitle">Acesse sua conta para continuar</p>
            </div>

            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-envelope"></i>E-mail
                    </label>
                    <input type="email" class="form-control" formControlName="email" placeholder="seu@email.com"
                        required />
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-lock"></i>Senha
                    </label>
                    <div class="password-wrapper">
                        <input [type]="showPassword ? 'text' : 'password'" class="form-control" formControlName="senha"
                            placeholder="Sua senha" required />
                        <button type="button" class="toggle-password" (click)="togglePasswordVisibility()"
                            aria-label="Alternar visualização da senha">
                            <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" [disabled]="loading">
                    <span *ngIf="!loading"><i class="bi bi-arrow-right-circle"></i>Entrar</span>
                    <span *ngIf="loading"><i class="bi bi-hourglass-split"></i>Autenticando...</span>
                </button>

                <div *ngIf="error" class="alert-error">
                    <i class="bi bi-exclamation-circle"></i>{{ error }}
                </div>
            </form>

            <div class="form-links">
                <a href="#" class="form-link">
                    <i class="bi bi-question-circle"></i>Esqueceu sua senha?
                </a>
            </div>

            <div class="divider"><span>ou</span></div>

            <button type="button" class="btn-register" routerLink="/cadastro">
                <i class="bi bi-person-plus"></i>Criar uma Nova Conta
            </button>
        </div>
    </section>
</main>
