<header class="ym-topbar" [class.ym-topbar--app]="isLoggedIn()">
  <nav class="ym-nav" aria-label="Navegação principal">
    <button #menuTrigger type="button" class="ym-menu-trigger"
      [attr.aria-label]="menuOpen ? 'Fechar menu de navegação' : 'Abrir menu de navegação'"
      [attr.title]="menuOpen ? 'Fechar menu de navegação' : 'Abrir menu de navegação'"
      [attr.aria-expanded]="menuOpen"
      [attr.aria-controls]="isLoggedIn() ? 'main-menu' : 'guest-menu'"
      (click)="toggleMenu()">
      <i class="bi" [class.bi-list]="!menuOpen" [class.bi-x-lg]="menuOpen" aria-hidden="true"></i>
    </button>

    <a class="ym-brand" routerLink="/" (click)="closeMenu()" aria-label="YourMoney — início">
      <span class="ym-brand-icon" aria-hidden="true"><i class="bi bi-wallet2"></i></span>
      <span>YourMoney</span>
    </a>

    @if (isLoggedIn()) {
      <div class="ym-topbar__actions" aria-label="Ações da conta">
        <button type="button" class="ym-topbar__icon-action"
          [attr.aria-label]="financialVisibility.valuesHidden() ? 'Mostrar valores' : 'Ocultar valores'"
          [attr.title]="financialVisibility.valuesHidden() ? 'Mostrar valores' : 'Ocultar valores'"
          [attr.aria-pressed]="financialVisibility.valuesHidden()" (click)="toggleFinancialValues()">
          <i class="bi" [class.bi-eye-slash]="financialVisibility.valuesHidden()"
            [class.bi-eye]="!financialVisibility.valuesHidden()" aria-hidden="true"></i>
        </button>
        <app-theme-toggle [iconOnly]="true"></app-theme-toggle>
        <a class="ym-topbar__text-action" routerLink="/configuracao" routerLinkActive="active"
          ariaCurrentWhenActive="page" (click)="closeMenu()">
          <i class="bi bi-gear" aria-hidden="true"></i><span class="ym-topbar__label">Configurações</span>
        </a>
        <button type="button" class="ym-topbar__text-action ym-topbar__logout" data-testid="logout" (click)="logout()">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i><span class="ym-topbar__label">Sair</span>
        </button>
      </div>
    } @else {
      <ul id="guest-menu" class="ym-menu" [class.ym-menu--open]="menuOpen">
        <li><a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i><span>Entrar</span></a></li>
        <li><a class="ym-menu__primary" routerLink="/cadastro" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()"><i class="bi bi-person-plus" aria-hidden="true"></i><span>Criar conta</span></a></li>
        <li><app-theme-toggle></app-theme-toggle></li>
      </ul>
    }
  </nav>

  @if (isLoggedIn()) {
    <button type="button" class="ym-app-drawer-backdrop" [class.ym-app-drawer-backdrop--open]="menuOpen"
      [attr.aria-hidden]="!menuOpen" [attr.tabindex]="menuOpen ? 0 : -1"
      aria-label="Fechar menu de navegação" (click)="closeMenu()"></button>

    <aside id="main-menu" class="ym-app-drawer" [class.ym-app-drawer--open]="menuOpen"
      [attr.aria-hidden]="!menuOpen" aria-label="Menu de navegação">
      <div class="ym-app-drawer__heading">
        <span class="ym-app-drawer__eyebrow">SEU ESPAÇO FINANCEIRO</span>
        <h2>Navegação</h2>
      </div>

      <nav class="ym-app-drawer__nav" aria-label="Telas do aplicativo">
        <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">
          <i class="bi bi-grid-1x2" aria-hidden="true"></i><span>Dashboard</span>
        </a>
        <a routerLink="/receitas" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">
          <i class="bi bi-arrow-down-left-circle" aria-hidden="true"></i><span>Receitas</span>
        </a>
        <a routerLink="/despesas" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">
          <i class="bi bi-arrow-up-right-circle" aria-hidden="true"></i><span>Despesas</span>
        </a>
        <a routerLink="/investimento" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">
          <i class="bi bi-graph-up-arrow" aria-hidden="true"></i><span>Investimentos</span>
        </a>
        <a routerLink="/metas" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">
          <i class="bi bi-bullseye" aria-hidden="true"></i><span>Metas</span>
        </a>
        <a routerLink="/openfinance" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">
          <i class="bi bi-bank" aria-hidden="true"></i><span>Conexões</span>
        </a>
      </nav>
    </aside>
  }
</header>

@if (isLoggedIn()) {
  <nav class="ym-mobile-nav" aria-label="Atalhos de navegação">
    <a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">
      <i class="bi bi-grid-1x2" aria-hidden="true"></i><span>Início</span>
    </a>
    <a routerLink="/receitas" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">
      <i class="bi bi-arrow-down-left-circle" aria-hidden="true"></i><span>Receitas</span>
    </a>
    <a class="ym-mobile-nav__primary" routerLink="/despesas" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">
      <i class="bi bi-plus-lg" aria-hidden="true"></i><span>Despesas</span>
    </a>
    <a routerLink="/investimento" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">
      <i class="bi bi-graph-up-arrow" aria-hidden="true"></i><span>Investimentos</span>
    </a>
  </nav>
}
